<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1490" viewBox="0 0 1120 1490" role="img" aria-labelledby="title desc">
<title id="title">恐慌买入逻辑：下穿加投，回升重置</title>
<desc id="desc">F&amp;G 日终指数由不低于阈值跌至阈值下方，额外买入 N。触发后回升至阈值加 5 才能再次触发。在指数日期之后的首个可用 ETF 交易日展示信号，与月度定投独立累加。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#73889a"/></marker>
  <marker id="tealArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2878b3"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#203448}
    .title{font-size:36px;font-weight:700}.subtitle{font-size:18px;fill:#607487}
    .heading{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#607487}
    .number{font-size:15px;font-weight:700;fill:#2878b3}.money{font-size:19px;font-weight:700}
    .line{fill:none;stroke:#73889a;stroke-width:2;marker-end:url(#arrow)}
    .loop{fill:none;stroke:#2878b3;stroke-width:2;marker-end:url(#tealArrow)}
    .card{fill:#fff;stroke:#dbe3e8;stroke-width:1.5}
  </style>
</defs>
<rect width="1120" height="1490" fill="#f3f6f8"/>
<rect x="56" y="50" width="6" height="76" rx="3" fill="#2878b3"/>
<text x="82" y="85" class="title">恐慌买入 · 加投逻辑</text>
<text x="82" y="119" class="subtitle">下穿才买 · 每次加投 N · 回升后重置</text>
<rect x="838" y="62" width="226" height="40" rx="20" fill="#e5eff9"/>
<text x="951" y="88" text-anchor="middle" font-size="16">默认阈值：10</text>
<rect class="card" x="56" y="184" width="280" height="174" rx="16"/>
<text x="80" y="218" class="number">独立的额外买入</text>
<text x="80" y="254" class="heading">蓝色 Buy 1x</text>
<text x="80" y="287" class="body">每次投入 1 × N</text>
<text x="80" y="318" class="small">与绿色月度定投独立累加</text>
<rect class="card" x="390" y="184" width="674" height="160" rx="16"/>
<text x="418" y="216" class="number">01 / 读取每日已公布指数</text>
<text x="418" y="254" class="heading">比较前后两次 F&amp;G 日终分数</text>
<text x="418" y="287" class="body">阈值 K 默认 10，可在主图调整</text>
<text x="418" y="317" class="small">首条记录已低于阈值，不视为一次下穿</text>
<path class="line" d="M727 344 V382"/>
<rect class="card" x="390" y="386" width="674" height="180" rx="16"/>
<text x="418" y="419" class="number">02 / 等待下穿阈值</text>
<text x="418" y="457" class="heading">前次 ≥ K，且本次 &lt; K</text>
<text x="418" y="493" class="body">同时处于「可触发」状态，才生成加投信号</text>
<text x="418" y="532" class="small">等于阈值不触发；持续低位不会每天重复买入</text>
<path class="line" d="M727 566 V604"/>
<rect x="390" y="608" width="674" height="184" rx="16" fill="#e5eff9" stroke="#ccdeef" stroke-width="1.5"/>
<text x="418" y="641" class="number">03 / 后续交易日额外买入</text>
<text x="418" y="681" class="heading">加投金额 = 1 × N</text>
<text x="418" y="717" class="body">指数日期之后的首个可用 ETF 交易日展示</text>
<text x="418" y="759" class="small">没有后续完整行情时，暂不生成买入</text>
<path class="line" d="M727 792 V830"/>
<rect class="card" x="390" y="834" width="674" height="168" rx="16"/>
<text x="418" y="867" class="number">04 / 暂停重复触发</text>
<text x="418" y="905" class="heading">触发后，等待指数回升</text>
<text x="418" y="940" class="body">未回到 K + 5 前，再次跌破 K 也不加投</text>
<text x="418" y="976" class="small">默认：10 附近反复震荡，不会连续买入</text>
<path class="line" d="M727 1002 V1040"/>
<rect class="card" x="390" y="1044" width="674" height="174" rx="16"/>
<text x="418" y="1077" class="number">05 / 回升重置</text>
<text x="418" y="1115" class="heading">指数 ≥ K + 5，恢复可触发</text>
<text x="418" y="1150" class="body">默认回升至 15 或以上，才可再次下穿买入</text>
<text x="418" y="1189" class="small">这是策略缓冲带，不是统计置信区间</text>
<path class="loop" d="M1064 1130 H1092 V476 H1066"/>
<text x="806" y="1254" class="small">重置后，回到步骤 02</text>
<rect x="56" y="440" width="280" height="470" rx="16" fill="#edf2f5" stroke="#dbe3e8"/>
<text x="80" y="479" class="heading">触发与重置示例</text>
<text x="80" y="519" class="small">以默认阈值 10 为例</text>
<text x="80" y="565" class="body">12 → 9：下穿</text>
<text x="80" y="597" class="money">买入一次 N</text>
<path d="M80 622 H312" stroke="#d0dae1"/>
<text x="80" y="659" class="body">9 → 8 → 11 → 9</text>
<text x="80" y="691" class="money">不重复买入</text>
<text x="80" y="723" class="small">尚未回到 15，不重置</text>
<path d="M80 748 H312" stroke="#d0dae1"/>
<text x="80" y="785" class="body">回到 15，再跌至 9</text>
<text x="80" y="817" class="money">可以再买一次 N</text>
<text x="80" y="864" class="small">先重置，再等待新的下穿</text>
<rect x="56" y="1300" width="1008" height="134" rx="14" fill="#e7edf1"/>
<text x="80" y="1337" class="heading">月度定投 + 恐慌加投，可以同日发生</text>
<text x="80" y="1375" class="body">例如当日月投 4N，恐慌额外买入 N，总投入为 5N。</text>
<text x="80" y="1408" class="small">恐慌加投不占月度定投次数，也不受每月一次限制。</text>
<text x="56" y="1463" class="small">N = 主图基准投入金额 · K = 主图 F&amp;G 加投阈值 · 金额使用 USD</text>
</svg>