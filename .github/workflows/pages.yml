name: Update data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  schedule:
    # F&G every six hours, anchored at regular close +3 min, including weekends.
    # Calendar gate selects only close +3/+63 min for ETFs, including early closes.
    - cron: '3 4 * * *'
      timezone: America/New_York
    - cron: '3 10 * * *'
      timezone: America/New_York
    - cron: '3 16 * * *'
      timezone: America/New_York
    - cron: '3 22 * * *'
      timezone: America/New_York
    - cron: '3 13 * * 1-5'
      timezone: America/New_York
    - cron: '3 14 * * 1-5'
      timezone: America/New_York
    - cron: '3 17 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      force:
        description: Refresh all sources even if already current
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages-and-data
  cancel-in-progress: false
  queue: max
jobs:
  schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.gate.outputs.sources }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select sources for this scheduled slot
        id: gate
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            node scripts/refresh-schedule.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'sources=Fear & Greed,SPY,QQQ,VGT' >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: schedule
    if: github.ref == 'refs/heads/main' && needs.schedule.outputs.sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued runs and retries use current code and snapshots.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: node --test test/*.test.mjs
      - name: Update sources
        id: update
        continue-on-error: true
        env:
          FEAR_GREED_SOURCE: ${{ vars.FEAR_GREED_SOURCE || 'auto' }}
          FORCE_REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
          REFRESH_SOURCES: ${{ needs.schedule.outputs.sources }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            node scripts/update-data.mjs
          else
            node scripts/update-data.mjs --scheduled
          fi
      - name: Save valid snapshots and source status
        id: save
        run: |
          node scripts/check-deploy-head.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/fear-greed.csv public/data/spy.json public/data/qqq.json public/data/vgt.json
          if [ -f public/data/status.json ]; then
            git add public/data/status.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshots and freshness status'
            git push origin HEAD:refs/heads/main
          fi
      - name: Build static site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify main has not advanced before deployment
        run: node scripts/check-deploy-head.mjs
      - name: Deploy valid data including failure status
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report incomplete source update
        if: steps.update.outcome == 'failure'
        run: |
          node -e "const s=JSON.parse(require('fs').readFileSync('public/data/status.json','utf8')); for(const r of s.results) if(!r.ok || !r.fresh) console.log(r.symbol + ': ' + (r.message || r.error || '数据未到齐'));"
          echo 'Sources are incomplete. Inspect data/status.json and the preceding steps.'
          exit 1
