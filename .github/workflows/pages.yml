name: Update data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  schedule:
    # Domestic Nasdaq-100 and S&P 500 ETFs: Tue-Sat 09:01 (after US close) and Mon-Sat 15:01/21:01 Beijing time.
    - cron: '1 9 * * 2-6'
      timezone: Asia/Shanghai
    - cron: '1 15 * * 1-6'
      timezone: Asia/Shanghai
    - cron: '1 21 * * 1-6'
      timezone: Asia/Shanghai
    # F&G Mon-Fri every six hours plus Tue-Sat 04:01 NY catch-up / revision check.
    # Calendar gate selects only close +1/+61 min for ETFs, including early closes.
    - cron: '1 4 * * 2-6'
      timezone: America/New_York
    - cron: '1 10 * * 1-5'
      timezone: America/New_York
    - cron: '1 16 * * 1-5'
      timezone: America/New_York
    - cron: '1 22 * * 1-5'
      timezone: America/New_York
    - cron: '1 13 * * 1-5'
      timezone: America/New_York
    - cron: '1 14 * * 1-5'
      timezone: America/New_York
    - cron: '1 17 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      force:
        description: Refresh all sources even if already current
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages-and-data
  cancel-in-progress: false
  queue: max
jobs:
  schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.gate.outputs.sources }}
      funds: ${{ steps.gate.outputs.funds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select sources for this scheduled slot
        id: gate
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$REFRESH_SCHEDULE" in
            '1 9 * * 2-6'|'1 15 * * 1-6'|'1 21 * * 1-6')
              echo 'funds=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
                node scripts/refresh-schedule.mjs >> "$GITHUB_OUTPUT"
              else
                echo 'sources=Fear & Greed,SPY,QQQ,VGT,SMH,BRK-B' >> "$GITHUB_OUTPUT"
                echo 'funds=true' >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
  build:
    needs: schedule
    if: github.ref == 'refs/heads/main' && (needs.schedule.outputs.sources != '' || needs.schedule.outputs.funds == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      deployments: read
      pages: read
    outputs:
      should_deploy: ${{ steps.sync.outputs.should_deploy }}
      head_sha: ${{ steps.save.outputs.head_sha }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      update_outcome: ${{ steps.update.outcome }}
      funds_outcome: ${{ steps.funds.outcome }}
      run_status_b64: ${{ steps.save.outputs.run_status_b64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued runs and retries use current code and snapshots.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Application regressions gate code pushes, not recurring market refreshes.
      # Each updater validates fetched data before replacing valid snapshots.
      - name: Test application on code push
        if: github.event_name == 'push'
        run: node --test test/*.test.mjs
      - name: Update sources
        id: update
        if: needs.schedule.outputs.sources != ''
        continue-on-error: true
        env:
          FEAR_GREED_SOURCE: ${{ vars.FEAR_GREED_SOURCE || 'auto' }}
          CNN_FETCH_USER_AGENT: ${{ vars.CNN_FETCH_USER_AGENT }}
          FORCE_REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
          REFRESH_SOURCES: ${{ needs.schedule.outputs.sources }}
        run: |
          ARGS=""
          if [ "$FORCE_REFRESH" != "true" ]; then
            ARGS="$ARGS --scheduled"
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            ARGS="$ARGS --catch-up"
          fi
          node scripts/update-data.mjs $ARGS
      - name: Update domestic ETF snapshots
        id: funds
        if: needs.schedule.outputs.funds == 'true'
        continue-on-error: true
        run: node scripts/update-funds.mjs
      - name: Prepare snapshots and local commit
        id: save
        run: |
          if [ -f public/data/status.json ]; then
            cp public/data/status.json "$RUNNER_TEMP/run-status.json"
            echo "run_status_b64=$(base64 -w 0 < "$RUNNER_TEMP/run-status.json")" >> "$GITHUB_OUTPUT"
          else
            echo 'run_status_b64=' >> "$GITHUB_OUTPUT"
          fi
          node scripts/check-deploy-head.mjs
          node scripts/filter-snapshot-commits.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/fear-greed.csv public/data/spy.json public/data/qqq.json public/data/vgt.json public/data/smh.json public/data/brk-b.json
          if [ -f public/data/status.json ]; then
            git add public/data/status.json
          fi
          if [ -f public/data/nasdaq100-etfs.json ]; then
            git add public/data/nasdaq100-etfs.json
          fi
          if [ -f public/data/sp500-etfs.json ]; then
            git add public/data/sp500-etfs.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshots and freshness status'
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'committed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Probe live Pages sync on unchanged schedule
        id: sync_probe
        if: github.event_name == 'schedule' && steps.save.outputs.committed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-pages-sync.mjs
      - name: Decide whether Pages deployment is needed
        id: sync
        env:
          COMMITTED: ${{ steps.save.outputs.committed }}
          PAGES_OUT_OF_SYNC: ${{ steps.sync_probe.outputs.pages_out_of_sync }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$COMMITTED" = "true" ] || [ "$PAGES_OUT_OF_SYNC" = "true" ]; then
            echo 'should_deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_deploy=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build static site
        if: steps.sync.outputs.should_deploy == 'true'
        env:
          DEPLOY_COMMIT_SHA: ${{ steps.save.outputs.head_sha }}
        run: node scripts/build-site.mjs
      - name: Push snapshot commit to main
        if: steps.save.outputs.committed == 'true'
        run: git push origin HEAD:refs/heads/main
      - name: Verify main has not advanced before upload
        if: steps.sync.outputs.should_deploy == 'true'
        run: node scripts/check-deploy-head.mjs
      - uses: actions/upload-pages-artifact@v4
        if: steps.sync.outputs.should_deploy == 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Report deployment and all source states
        if: always() && steps.update.outcome != 'skipped' && (failure() || steps.sync.outputs.should_deploy != 'true')
        env:
          DEPLOY_OUTCOME: skipped
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/run-status.json" ]; then
            export STATUS_FILE="$RUNNER_TEMP/run-status.json"
          fi
          node scripts/report-data-status.mjs
      - name: Report fund update failure
        if: always() && steps.funds.outcome == 'failure' && (failure() || steps.sync.outputs.should_deploy != 'true')
        run: |
          echo '部分基金数据更新失败；页面保留相应的上次有效数据，请核对各区间日期。'
          exit 1
  deploy:
    needs: [schedule, build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify main has not advanced before deployment
        run: node scripts/check-deploy-head.mjs
      - name: Wait for uploaded Pages artifact
        env:
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-pages-artifact.mjs
      - uses: actions/configure-pages@v5
      - name: Deploy valid data including failure status
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Wait and re-verify main before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          sleep 15
          node scripts/check-deploy-head.mjs
      - name: Retry Pages deployment after transient failure
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Report deployment and all source states
        if: always() && needs.build.outputs.update_outcome != 'skipped'
        env:
          PRIMARY_OUTCOME: ${{ steps.deployment.outcome }}
          RETRY_OUTCOME: ${{ steps.deployment_retry.outcome }}
          UPDATE_OUTCOME: ${{ needs.build.outputs.update_outcome }}
          RUN_STATUS_B64: ${{ needs.build.outputs.run_status_b64 }}
        run: |
          if [ -n "$RUN_STATUS_B64" ]; then
            printf '%s' "$RUN_STATUS_B64" | base64 -d > "$RUNNER_TEMP/run-status.json"
            export STATUS_FILE="$RUNNER_TEMP/run-status.json"
          fi
          DEPLOY_OUTCOME="$PRIMARY_OUTCOME"
          if [ "$PRIMARY_OUTCOME" = "success" ] || [ "$RETRY_OUTCOME" = "success" ]; then
            DEPLOY_OUTCOME="success"
          elif [ -n "$RETRY_OUTCOME" ] && [ "$RETRY_OUTCOME" != "skipped" ]; then
            DEPLOY_OUTCOME="$RETRY_OUTCOME"
          fi
          export DEPLOY_OUTCOME
          node scripts/report-data-status.mjs
      - name: Report fund update failure
        if: always() && needs.build.outputs.funds_outcome == 'failure'
        run: |
          echo '部分基金数据更新失败；页面保留相应的上次有效数据，请核对各区间日期。'
          exit 1
