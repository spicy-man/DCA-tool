name: Update data and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  schedule:
    # Domestic Nasdaq-100 and S&P 500 ETFs: anchored at 15:01 Beijing time, every six hours.
    - cron: '1 3 * * *'
      timezone: Asia/Shanghai
    - cron: '1 9 * * *'
      timezone: Asia/Shanghai
    - cron: '1 15 * * *'
      timezone: Asia/Shanghai
    - cron: '1 21 * * *'
      timezone: Asia/Shanghai
    # F&G every six hours, anchored at regular close +1 min, including weekends.
    # Calendar gate selects only close +1/+61 min for ETFs, including early closes.
    - cron: '1 4 * * *'
      timezone: America/New_York
    - cron: '1 10 * * *'
      timezone: America/New_York
    - cron: '1 16 * * *'
      timezone: America/New_York
    - cron: '1 22 * * *'
      timezone: America/New_York
    - cron: '1 13 * * 1-5'
      timezone: America/New_York
    - cron: '1 14 * * 1-5'
      timezone: America/New_York
    - cron: '1 17 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      force:
        description: Refresh all sources even if already current
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pages-and-data
  cancel-in-progress: false
  queue: max
jobs:
  schedule:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.gate.outputs.sources }}
      funds: ${{ steps.gate.outputs.funds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select sources for this scheduled slot
        id: gate
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$REFRESH_SCHEDULE" in
            '1 3 * * *'|'1 9 * * *'|'1 15 * * *'|'1 21 * * *')
              echo 'funds=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
                node scripts/refresh-schedule.mjs >> "$GITHUB_OUTPUT"
              else
                echo 'sources=Fear & Greed,SPY,QQQ,VGT,SMH' >> "$GITHUB_OUTPUT"
                echo 'funds=true' >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
  publish:
    needs: schedule
    if: github.ref == 'refs/heads/main' && (needs.schedule.outputs.sources != '' || needs.schedule.outputs.funds == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued runs and retries use current code and snapshots.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test
        run: node --test test/*.test.mjs
      - name: Update sources
        id: update
        if: needs.schedule.outputs.sources != ''
        continue-on-error: true
        env:
          FEAR_GREED_SOURCE: ${{ vars.FEAR_GREED_SOURCE || 'auto' }}
          CNN_FETCH_USER_AGENT: ${{ vars.CNN_FETCH_USER_AGENT }}
          FORCE_REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
          REFRESH_SOURCES: ${{ needs.schedule.outputs.sources }}
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            node scripts/update-data.mjs
          else
            node scripts/update-data.mjs --scheduled
          fi
      - name: Update domestic ETF snapshots
        id: funds
        if: needs.schedule.outputs.funds == 'true'
        continue-on-error: true
        run: node scripts/update-funds.mjs
      - name: Save valid snapshots and source status
        id: save
        run: |
          node scripts/check-deploy-head.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/fear-greed.csv public/data/spy.json public/data/qqq.json public/data/vgt.json public/data/smh.json
          if [ -f public/data/status.json ]; then
            git add public/data/status.json
          fi
          if [ -f public/data/nasdaq100-etfs.json ]; then
            git add public/data/nasdaq100-etfs.json
          fi
          if [ -f public/data/sp500-etfs.json ]; then
            git add public/data/sp500-etfs.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update market snapshots and freshness status'
            git push origin HEAD:refs/heads/main
          fi
      - name: Build static site
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Verify main has not advanced before deployment
        run: node scripts/check-deploy-head.mjs
      - name: Deploy valid data including failure status
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report deployment and all source states
        if: always() && steps.update.outcome != 'skipped'
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
        run: node scripts/report-data-status.mjs
      - name: Report fund update failure
        if: always() && steps.funds.outcome == 'failure'
        run: |
          echo '部分基金数据更新失败；页面保留相应的上次有效数据，请核对各区间日期。'
          exit 1
